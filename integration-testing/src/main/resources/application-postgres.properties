# Used by the bonus level 6 (mvn test -Ppostgres).
# Create the database first:   CREATE DATABASE library_test;
# WARNING: use an EMPTY test database. Hibernate creates the tables "books" and "loans" and DROPS them at the end.
spring.datasource.url=jdbc:postgresql://localhost:5432/library_test
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=create-drop
